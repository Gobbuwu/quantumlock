# QuantumLock backend settings.
# Values written as ${NAME:default} can be changed with an environment variable or in a
# local .env file (see .env.example). Nothing secret belongs in this file: it is public on GitHub.

spring:
  application:
    name: quantumlock-backend
  config:
    # Optional local settings file, ignored by git. Looked up in the folder the app is
    # started from, so it works from backend/ (mvn) and from the repository root (IDE).
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/quantumlock}
    username: ${DB_USERNAME:quantumlock}
    # No default on purpose. The app refuses to start until you set DB_PASSWORD yourself,
    # so a well-known password can never end up protecting the key store.
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  servlet:
    multipart:
      # The API has no file uploads, so Spring should not parse multipart bodies at all.
      enabled: false
  web:
    error:
      # Error responses carry a status code only: no exception names, messages or stack traces,
      # and they do not repeat the requested path (nothing the caller sent is echoed back).
      include-message: never
      include-binding-errors: never
      include-stacktrace: never
      include-exception: false
      include-path: never

server:
  # Listen on this computer only. Spring Boot would otherwise accept connections from the
  # whole network (for example everyone on the same Wi-Fi). Change this only together with
  # TLS and rate limiting (see SECURITY.md, "Before the API is reachable from another computer").
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  tomcat:
    # Form posts are parsed by Tomcat itself, so they get the same size limit as other bodies.
    max-http-form-post-size: ${MAX_REQUEST_BYTES:65536}
    # Close connections that stay silent for 10 seconds, so stalled requests cannot hold worker threads for long.
    connection-timeout: 10s

springdoc:
  # Swagger UI and the OpenAPI document are a development aid. Set API_DOCS_ENABLED=false to switch both off.
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    path: /swagger-ui.html

quantumlock:
  # Encrypts every stored private key (AES-256-GCM). 32 random bytes, Base64 encoded. No default on purpose:
  # the app refuses to start without it. Keep it out of git and keep a copy: if it is lost, every stored
  # private key is lost with it. See backend/.env.example for how to create one.
  master-key: ${MASTER_KEY}
  security:
    # Host names the API answers to (comma separated). Requests with any other Host header get 400.
    allowed-hosts: ${ALLOWED_HOSTS:localhost,127.0.0.1}
    # Largest request body in bytes. Larger requests get 413.
    max-request-bytes: ${MAX_REQUEST_BYTES:65536}
