# Compiles the backend and runs its tests. Started by ci.yml for every pull request and every push to main.
# Tests use an in-memory H2 database, so no PostgreSQL service is needed here.
name: Backend CI

on:
  # Started by ci.yml for every pull request and every push to main, when the files this checks have changed.
  workflow_call:
  # Adds a "Run workflow" button on the Actions tab, to start this check by hand.
  workflow_dispatch:

# Least privilege: this workflow only needs to read the code.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      # Actions are pinned to an exact commit so a changed tag cannot change what runs here.
      # Dependabot (.github/dependabot.yml) proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: ./mvnw -B verify
