# Compiles the backend and runs its tests on every pull request and on every push to main.
# It runs for every pull request, also ones that do not touch the backend, because the branch
# rule on main requires this check: a pull request where it never ran could not be merged.
# Tests use an in-memory H2 database, so no PostgreSQL service is needed here.
name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
  # Adds a "Run workflow" button on the Actions tab, to start this check by hand.
  workflow_dispatch:

# Least privilege: this workflow only needs to read the code.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      # Actions are pinned to an exact commit so a changed tag cannot change what runs here.
      # Dependabot (.github/dependabot.yml) proposes updates.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: ./mvnw -B verify
