# Tests and builds the React dashboard. Started by ci.yml when a change touches it.
name: Dashboard CI

on:
  # Started by ci.yml for every pull request and every push to main, when the files this checks have changed.
  workflow_call:
  # Adds a "Run workflow" button on the Actions tab, to start this check by hand.
  workflow_dispatch:

# Least privilege: this workflow only needs to read the code.
permissions:
  contents: read

jobs:
  dashboard:
    # Linux and macOS (KAN-43). macOS runners are free for public repositories.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      # Actions are pinned to an exact commit so a changed tag cannot change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install exact versions from package-lock.json
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
