# Tests and builds the React dashboard on every pull request and on every push to main that touches it.
name: Dashboard CI

on:
  push:
    branches:
      - main
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard-ci.yml"
  pull_request:
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard-ci.yml"
  workflow_dispatch:

# Least privilege: this workflow only needs to read the code.
permissions:
  contents: read

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      # Actions are pinned to an exact commit so a changed tag cannot change what runs here.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install exact versions from package-lock.json
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
