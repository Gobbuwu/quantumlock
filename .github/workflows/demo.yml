# Demo scripts (KAN-26): demo/ci-test.sh runs setup, start, real requests through the dashboard, Ctrl+C and remove,
# once with the bash scripts and once with the PowerShell scripts, on an empty PostgreSQL 16, on Linux and macOS.
name: Demo scripts

on:
  # Started by ci.yml for every pull request and every push to main, when the files this checks have changed.
  workflow_call:
  # Adds a "Run workflow" button on the Actions tab, to start this check by hand.
  workflow_dispatch:

# Least privilege: this workflow only needs to read the code.
permissions:
  contents: read

jobs:
  demo:
    # Linux and macOS (KAN-43). macOS runners are free for public repositories.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        scripts: [sh, ps1]
    steps:
      # Actions are pinned to an exact commit so a changed tag cannot change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      # A Mac comes with bash 3.2 (/bin/bash). The runner also has a newer bash from Homebrew, which would hide bash 3.2
      # problems, so the scripts run with /bin/bash, as on a Mac where nothing extra was installed.
      - name: Use the bash that comes with macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/macos-bash"
          ln -sf /bin/bash "$RUNNER_TEMP/macos-bash/bash"
          echo "$RUNNER_TEMP/macos-bash" >> "$GITHUB_PATH"

      # PostgreSQL 16: Docker on Linux, Homebrew on macOS. See .github/actions/start-postgres/action.yml.
      - name: Start PostgreSQL
        uses: ./.github/actions/start-postgres

      - name: Versions
        run: |
          bash --version | head -n 1
          psql --version
          pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      - name: Demo scripts (${{ matrix.scripts }})
        run: ./demo/ci-test.sh "${{ matrix.scripts }}"
